name: CI

on:
  pull_request:
    branches: [prd, stg, dev]
    paths-ignore:
      - "**/README.md"
      - "**/.gitignore"
      - "**/docs/*"

jobs:
  checkMeds:
    name: Check Meds (merge every day)
    runs-on: ubuntu-latest
    steps:
      - name: Check Meds
        uses: byuawsfhtl/MedsAction@v1.0.0

  standardCheck:
    name: Python Standard Check
    runs-on: ubuntu-latest
    steps:
      - name: Follow Python Standard
        uses: byuawsfhtl/PythonStandardAction@v1.2.0
  
  checkTests:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RLL_BOT_PA_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm ci
          npm run build

      - name: Check Test Coverage
        uses: byuawsfhtl/TestCoverageAction@v1.0.0
        with:
          exclude_paths: 'tests/*'